name: Build SFA (custom icon)

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "app/src/main/res/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SFA (this repo)
        uses: actions/checkout@v4
        with:
          path: sing-box-for-android

      - name: Checkout sing-box core
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: testing
          path: sing-box

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: sing-box/go.sum

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n1)
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;28.0.13004108" "platform-tools"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Install gomobile
        working-directory: sing-box
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          gomobile init || true

      - name: Build libbox.aar
        working-directory: sing-box
        run: |
          go run ./cmd/internal/build_libbox -target android
          mkdir -p ../sing-box-for-android/app/libs
          cp -f libbox.aar ../sing-box-for-android/app/libs/ 2>/dev/null || true
          cp -f libbox-legacy.aar ../sing-box-for-android/app/libs/ 2>/dev/null || true
          ls -lh ../sing-box-for-android/app/libs/

      - name: Prepare signing (ephemeral if no secrets)
        working-directory: sing-box-for-android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            KS_PASS="$KEYSTORE_PASS"; ALIAS="$ALIAS_NAME"; ALIAS_P="$ALIAS_PASS"
          else
            KS_PASS="sfa-custom"; ALIAS="sfa"; ALIAS_P="sfa-custom"
            keytool -genkeypair -v -keystore app/release.keystore -storepass "$KS_PASS" -alias "$ALIAS" -keypass "$ALIAS_P" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SFA Custom, OU=Personal, O=Personal, L=Singapore, ST=Singapore, C=SG"
          fi
          PROPS=$(printf "KEYSTORE_PASS=%s\nALIAS_NAME=%s\nALIAS_PASS=%s\n" "$KS_PASS" "$ALIAS" "$ALIAS_P" | base64 -w0)
          echo "LOCAL_PROPERTIES=$PROPS" >> $GITHUB_ENV

      - name: Assemble APK (other flavor, release)
        working-directory: sing-box-for-android
        run: ./gradlew :app:assembleOtherRelease --stacktrace

      - name: Rename APKs to SFA
        working-directory: sing-box-for-android
        run: |
          mkdir -p dist
          for f in app/build/outputs/apk/other/release/*.apk; do
            base=$(basename "$f")
            case "$base" in
              *universal*) cp "$f" dist/SFA.apk ;;
              *arm64-v8a*) cp "$f" dist/SFA-arm64-v8a.apk ;;
              *armeabi-v7a*) cp "$f" dist/SFA-armeabi-v7a.apk ;;
              *x86_64*) cp "$f" dist/SFA-x86_64.apk ;;
              *x86*) cp "$f" dist/SFA-x86.apk ;;
              *) cp "$f" "dist/$base" ;;
            esac
          done
          ls -lh dist/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SFA
          path: sing-box-for-android/dist/*.apk
          if-no-files-found: error
